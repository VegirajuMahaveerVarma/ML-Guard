name: Build and publish GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag matches project version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$tag_version" != "$project_version" ]]; then
            echo "Tag $tag_version does not match pyproject version $project_version"
            exit 1
          fi

      - name: Install build tools and test dependencies
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[dev,sklearn]"

      - name: Run lint
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz

      - name: Smoke-test the built wheel
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/mlguard-wheel-check"
          python -m pip install --no-deps --target "$install_dir" dist/*.whl
          PYTHONPATH="$install_dir" python -c 'import mlguard; print("Installed version:", mlguard.__version__)'
          PYTHONPATH="$install_dir" python -m mlguard --version

      - name: Generate SHA-256 checksums
        run: sha256sum dist/*.whl dist/*.tar.gz > checksums.txt

      - name: Publish GitHub alpha release
        uses: softprops/action-gh-release@v2
        with:
          name: MLGuard ${{ github.ref_name }} — Alpha
          body_path: docs/releases/v0.1.0.md
          prerelease: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            checksums.txt

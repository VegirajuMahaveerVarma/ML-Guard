name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,sklearn]"
      - run: python -m ruff check .
      - run: python -m pytest

      - name: Install build verification tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke-test installed wheel outside the checkout
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/mlguard-wheel-check"
          python -m pip install --no-deps --target "$install_dir" dist/*.whl
          cd "$RUNNER_TEMP"
          PYTHONPATH="$install_dir" python -c 'import mlguard; print("Installed version:", mlguard.__version__)'
          PYTHONPATH="$install_dir" python -m mlguard --version

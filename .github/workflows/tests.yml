name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,sklearn]"
      - run: python -m ruff check .
      - run: python -m pytest
      - name: Run controlled fault-injection smoke evaluation
        run: python examples/fault_injection_demo.py
      - name: Run synthetic distribution-shift experiment
        run: python examples/distribution_shift_experiment.py --trials 100 --sample-size 512

      - name: Install build verification tools
        run: python -m pip install build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*.whl dist/*.tar.gz
      - name: Smoke-test wheel in a clean virtual environment
        shell: bash
        run: |
          venv_dir="$RUNNER_TEMP/mlguard-wheel-venv"
          python -m venv "$venv_dir"
          "$venv_dir/bin/python" -m pip install dist/*.whl
          "$venv_dir/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$venv_dir/bin/python" - <<'PY'
          import numpy as np
          from mlguard import ModelGuard, __version__

          class ThresholdModel:
              def predict(self, X):
                  return (np.asarray(X)[:, 0] > 0.5).astype(int)

          report = ModelGuard(ThresholdModel()).run(
              np.array([[0.1], [0.9]]),
              checks=("prediction_stability",),
          )
          assert report.results[0].status == "passed"
          print("Installed version:", __version__)
          PY
          "$venv_dir/bin/mlguard" --version
          "$venv_dir/bin/mlguard" list-checks
